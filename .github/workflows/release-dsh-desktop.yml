name: Release Deepsee HARNESS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DSH_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install DeepSeek Harness dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build DeepSeek Harness
        run: corepack pnpm run build
      - name: Install desktop dependencies
        working-directory: dsh-desktop
        run: corepack pnpm install --frozen-lockfile
      - name: Package and publish the installer
        working-directory: dsh-desktop
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npm run release:github
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq $attempts) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds (30 * $attempt)
          }
